# One mbn-cms site per container. App root is /var/www/app (contains app/ and web/).
server {
    listen 80 default_server;
    server_name _;
    root /var/www/app/web;
    index index.php;
    add_header Access-Control-Allow-Origin *;

    # Query-string filters carried over from the web102 vhosts.
    set $block 0;
    if ($query_string ~* "union.*select.*\(")               { set $block 1; }
    if ($query_string ~* "union.*all.*select")              { set $block 1; }
    if ($query_string ~* "concat.*\(")                      { set $block 1; }
    if ($query_string ~ "[a-zA-Z0-9_]=http://")             { set $block 1; }
    if ($query_string ~ "[a-zA-Z0-9_]=(\.\.//?)+")          { set $block 1; }
    if ($query_string ~ "[a-zA-Z0-9_]=/([a-z0-9_.]//?)+")   { set $block 1; }
    if ($query_string ~* "(<|%3C).*script.*(>|%3E)")        { set $block 1; }
    if ($query_string ~ "GLOBALS(=|\[|\%[0-9A-Z]{0,2})")    { set $block 1; }
    if ($query_string ~ "_REQUEST(=|\[|\%[0-9A-Z]{0,2})")   { set $block 1; }
    if ($query_string ~ "proc/self/environ")                { set $block 1; }
    if ($query_string ~ "base64_(en|de)code\(.*\)")         { set $block 1; }
    if ($http_user_agent ~ "(Indy Library|libwww-perl|GetRight|GetWeb!|Go!Zilla|Download Demon|Go-Ahead-Got-It|TurnitinBot|GrabNet)") { set $block 1; }
    if ($block) { return 403; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Dotfiles, logs, dumps, templates, installer and phpinfo must never be served.
    location ^~ /.well-known/                                   { try_files $uri =404; }
    location ~ /\.                                              { return 404; }
    location ~* \.(log|sql|bak|old|orig|swp|ini|sh|env|volt|phtml)$ { return 404; }
    location = /info.php                                        { return 404; }
    location = /install.php                                     { return 404; }

    # Missing images are rendered by the app (general-image). index.php routes off
    # $_SERVER['REQUEST_URI'], which an error_page internal redirect does NOT rewrite,
    # so a =200 fallback would dispatch /uploads/... (UploadsController 404). Instead hand
    # FastCGI an explicit REQUEST_URI/QUERY_STRING pointing at the general-image action.
    location ~* \.(jpg|jpeg|gif|png|webp|ico|svg)$ {
        log_not_found off;
        expires max;
        try_files $uri @genimg;
    }
    location @genimg {
        fastcgi_pass 127.0.0.1:9000;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI /administrator/general-image?url=$request_uri;
        fastcgi_param QUERY_STRING url=$request_uri;
        fastcgi_param HTTPS $fcgi_https if_not_empty;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~* \.(css|js|eot|ttf|woff|woff2)$ {
        expires max;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?_url=$uri&$args;
    }

    # index.php is the only PHP entry point. Any other .php (uploads, themes, caches) is 404,
    # so a dropped webshell cannot be executed over HTTP.
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $fcgi_https if_not_empty;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
    location ~ \.php$ { return 404; }
}
