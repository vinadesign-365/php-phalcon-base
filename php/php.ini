; Production overrides for the mbn-cms sites.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
date.timezone = Asia/Ho_Chi_Minh

memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 100M
post_max_size = 100M
max_input_vars = 5000

allow_url_include = Off
cgi.fix_pathinfo = 0
; Upload.php falls back to fileinfo when exec() is disabled.
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,show_source,putenv

session.save_path = /var/lib/php/sessions
session.cookie_httponly = 1
session.use_strict_mode = 1

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Volt compiles templates at runtime, so timestamps must stay validated.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

apc.enabled = 1
apc.shm_size = 64M
